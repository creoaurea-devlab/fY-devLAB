<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DevLab · DeepSeek Harness Runtime</title>
<style>:root{font:14px Inter,system-ui,sans-serif;color:#26362f;background:#f5f6f3}*{box-sizing:border-box}body{margin:0}header{padding:12px 16px;border-bottom:1px solid #d5ddd7;background:#fff;display:flex;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:17px;margin:0}button,input,select,textarea{font:inherit;border:1px solid #c8d3ca;border-radius:4px;padding:7px;color:inherit;background:white}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #294c3d;outline-offset:2px}.layout{display:grid;grid-template-columns:minmax(210px,30%) minmax(0,1fr);height:calc(100vh - 70px)}aside{overflow:auto;border-right:1px solid #d5ddd7;padding:10px}main{overflow:auto;padding:18px;min-width:0}.entry{display:block;width:100%;text-align:left;margin:4px 0;overflow-wrap:anywhere}.entry[aria-pressed=true]{background:#e4eee4;border-color:#294c3d}.entry small{display:block;color:#53665b}p{line-height:1.6}code,pre{overflow-wrap:anywhere;white-space:pre-wrap}textarea{width:100%;min-height:160px;resize:vertical}label{display:block;margin:10px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}#error{color:#9f1239}dl{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px}dd{margin:0;overflow-wrap:anywhere}#search{width:100%}.badge{background:#e4eee4;border:1px solid #c8d3ca;border-radius:4px;padding:3px 6px}small{color:#53665b}@media(max-width:640px){.layout{grid-template-columns:minmax(125px,36%) minmax(0,1fr)}main{padding:10px}aside{padding:6px}dl{grid-template-columns:minmax(0,1fr)}header{padding:8px}h1{font-size:15px}}</style>
<header><h1>DeepSeek Harness Runtime</h1><span id="summary" role="status">Connecting…</span><button id="refresh">Refresh</button><button id="audit">Test all packages</button><button id="rewind">Rewind selection</button><a href="/api/registry" target="_blank">Registry</a></header>
<div class="layout"><aside aria-label="Upstream packages"><label>Filter packages<input id="search" type="search"></label><label>Show<select id="filter"><option value="all">All packages</option><option value="installed">Installed</option><option value="active">Active</option><option value="failed">Needs attention</option></select></label><div id="packages"></div></aside><main><p id="error" role="alert"></p><div id="detail"></div></main></div>
<script>
let inventory,selected='',busy=false;const drafts=new Map();const el=id=>document.getElementById(id);const escape=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function request(path,body){const response=await fetch('/api/'+path,body===undefined?{}:{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const value=await response.json();if(!response.ok)throw Error(value.message);return value}
async function refresh(){inventory=await request('inventory');if(!selected)selected=inventory.packages.find(p=>p.id==='@deepseek-ai/dsh-tools')?.id??inventory.packages[0]?.id;render()}
function render(){el('rewind').disabled=busy;el('audit').disabled=busy||inventory.audit.running;const active=inventory.entries.filter(e=>e.state==='active').length;el('summary').textContent=`${inventory.packages.length} packages · ${active} active · ${inventory.tests.length} tested${inventory.audit.running?' · testing '+inventory.audit.completed+'/'+inventory.audit.total:''}`;const query=el('search').value.toLowerCase(),filter=el('filter').value;el('packages').innerHTML=inventory.packages.filter(p=>{const entry=inventory.entries.find(e=>e.module===p.id),test=inventory.tests.find(t=>t.id===p.id);return(p.id+' '+p.description).toLowerCase().includes(query)&&(filter==='all'||filter==='installed'&&p.installed||filter==='active'&&entry?.state==='active'||filter==='failed'&&test&&['failed','timeout','pending','unavailable'].includes(test.outcome))}).map(p=>{const state=inventory.entries.find(e=>e.module===p.id)?.state??'off';return `<button class="entry" data-id="${escape(p.id)}" aria-pressed="${p.id===selected}">${escape(p.id.replace('@deepseek-ai/',''))}<small>${escape(state)} · ${p.installed?'installed':p.private?'private':'unavailable'}</small></button>`}).join('');for(const button of el('packages').querySelectorAll('button'))button.onclick=()=>{selected=button.dataset.id;render()};renderDetail()}
function renderDetail(){const p=inventory.packages.find(p=>p.id===selected);if(!p)return;const state=inventory.entries.find(e=>e.module===p.id),test=inventory.tests.find(t=>t.id===p.id);el('detail').innerHTML=`<h2>${escape(p.id)}</h2><p>${escape(p.description)}</p><dl><dt>Version</dt><dd>${escape(p.version)}</dd><dt>Type</dt><dd>${escape(p.kind)}</dd><dt>State</dt><dd>${escape(state?.state??'off')}</dd><dt>License</dt><dd>${escape(p.license)} · ${p.distribution==='review'?'dependency review recorded':'retain notices'}</dd><dt>Platform</dt><dd>${p.platform?'supported on this host':'another OS/CPU required'}</dd></dl><label>Native plugin configuration (JSON)<textarea id="config" aria-label="Native plugin configuration">${escape(drafts.get(p.id)??'{}')}</textarea></label><div class="actions"><button id="on" ${busy||!p.installed||!p.platform||p.private?'disabled':''}>Enable plugin</button><button id="off" ${busy||!p.installed||!p.platform||p.private?'disabled':''}>Disable plugin</button><button id="probe" ${busy?'disabled':''}>Test this package</button></div><p>Runs unchanged upstream code in the owned Harness process. Individual tests use a separate disposable context. Pending means required configuration or services are missing.</p>${state?.error?'<pre>'+escape(state.error)+'</pre>':''}<h3>Last individual test</h3>${test?`<p>${escape(test.outcome)} · off ${test.off} · active ${test.on} · cleanup ${test.cleanup}</p><pre>${escape(test.reason??'')}</pre>`:'<p>No test recorded.</p>'}<details><summary>Package dependencies (${p.dependencies.length})</summary><pre>${escape(p.dependencies.join('\n'))}</pre></details>`;el('config').oninput=()=>drafts.set(p.id,el('config').value);el('on').onclick=()=>void configure(true);el('off').onclick=()=>configure(false);el('probe').onclick=()=>action(async()=>{await request('probe',{id:p.id,config:JSON.parse(el('config').value)});await refresh()})}
async function action(fn){if(busy)return;busy=true;for(const id of ['on','off','probe','audit','rewind'])if(el(id))el(id).disabled=true;el('error').textContent='';try{await fn()}catch(error){el('error').textContent=error.message}finally{busy=false;if(inventory)render();await refresh().catch(error=>el('error').textContent=error.message)}}
async function configure(enabled){let config;try{config=JSON.parse(el('config').value)}catch(error){el('error').textContent='Configuration must be valid JSON';return}return action(async()=>{await request('selection',{revision:inventory.revision,id:selected,enabled,config});await refresh()})}
el('refresh').onclick=()=>refresh().catch(error=>el('error').textContent=error.message);el('search').oninput=render;el('filter').onchange=render;el('rewind').onclick=()=>action(async()=>{await request('rewind',{revision:inventory.revision});await refresh()});el('audit').onclick=()=>action(async()=>{await request('test-all',{});await refresh()});refresh().catch(error=>el('error').textContent=error.message);setInterval(()=>{if(inventory?.audit.running&&!busy)void refresh().catch(error=>el('error').textContent=error.message)},2000);
</script></html>
