acceptance:
- A preserved Linux tmux owner has its own user scope, and a real backend service
  stop or cgroup cleanup leaves the shell PID, state and ownership intact.
- Ordinary and Strict terminals retain their existing policy; explicit close still
  cleans the shell, descendants and owned tmux process.
- Do not weaken backend KillMode, sandbox policy, resource cleanup or change user
  credentials.
