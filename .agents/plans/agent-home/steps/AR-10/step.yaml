acceptance:
- 'AH-01: One bounded data loader resolves step → kind workflow → execution role →
  ownership segment/domain skills; it returns source digests/revisions.'
- 'AH-06: Ownership grouping changes navigation without merging disjoint capability
  scopes; exact ownership is unique and dependencies remain acyclic.'
- 'AH-07: During transition, existing SQL/JSON authorities remain active. Full per-step
  YAML and ownership files become authoritative only at explicit activation.'
- 'AH-01: Kind discovery comes from workflow metadata; old runtime lists are generated
  compatibility values. Review-assessment semantics implement the AR-09 contract.'
- 'AH-06: Publish one staged ownership segment file per existing capability, including
  domain skills/profile mapping; activation selects these instead of SQL ownership,
  without editing live grants.'
- 'AH-06: Materialize six selected domain skill assets under .agents with provenance.
  Canonical ownership segments reference those domain skills and permitted role IDs;
  workflow chooses execution role. Active reads retire old external skill/profile
  references at activation, retaining originals as provenance.'
